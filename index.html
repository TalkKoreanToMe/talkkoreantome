<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>TalkKoreanToMe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
    .tab-active {
      background-color: #D97690;
      color: white;
    }
    .fade {
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#FFF9F5] px-4 py-10">

  <!-- Titre -->
  <h1 class="text-center text-4xl font-extrabold text-[#D97690] mb-6">TalkKoreanToMe</h1>

  <!-- Onglets -->
  <div class="flex justify-center mb-8">
    <button onclick="showTab('flashcards')" id="tab-flashcards" class="px-4 py-2 border rounded-l-lg border-[#D97690] tab-active">📚 Flashcards</button>
    <button onclick="showTab('quiz')" id="tab-quiz" class="px-4 py-2 border-t border-b border-r rounded-r-lg border-[#D97690]">🧠 Quiz</button>
  </div>

  <!-- Flashcard section -->
  <div id="flashcards" class="fade">
    <div id="scoreDisplay" class="text-center text-[#A47272] mb-6 font-semibold text-lg">Score : 0 / 0</div>
    <div id="flashcardContainer" class="flex flex-col items-center space-y-6"></div>
  </div>

  <!-- Quiz section -->
  <div id="quiz" class="hidden fade">
    <div id="quizContainer" class="flex flex-col items-center space-y-6"></div>
  </div>

  <script>
    const flashcards = [
      {
        letter: "ㅂ", image: "https://cdn-icons-png.flaticon.com/512/1046/1046750.png",
        word: "빵", translation: "pain",
        audio: "https://ssl.gstatic.com/dictionary/static/sounds/oxford/bread--_fr_1.mp3"
      },
      {
        letter: "ㅁ", image: "https://cdn-icons-png.flaticon.com/512/415/415733.png",
        word: "물", translation: "eau",
        audio: "https://ssl.gstatic.com/dictionary/static/sounds/oxford/water--_fr_1.mp3"
      },
      {
        letter: "ㄱ", image: "https://cdn-icons-png.flaticon.com/512/685/685352.png",
        word: "고양이", translation: "chat",
        audio: "https://ssl.gstatic.com/dictionary/static/sounds/oxford/cat--_fr_1.mp3"
      }
    ];

    let currentIndex = 0, score = 0;

    function updateScoreDisplay() {
      document.getElementById("scoreDisplay").textContent = `Score : ${score} / ${currentIndex}`;
    }

    function playAudio(url) {
      const audio = new Audio(url);
      audio.play();
    }

    function showFlashcard(index) {
      const card = flashcards[index];
      const container = document.getElementById("flashcardContainer");
      updateScoreDisplay();

      container.innerHTML = `
        <div class="bg-white rounded-3xl shadow-xl p-6 w-[350px] text-center space-y-4 border border-[#EBDACF] fade">
          <div class="text-6xl font-extrabold text-[#D97690]">${card.letter}</div>
          <div class="w-full h-40 bg-[#F8EDEB] rounded-xl flex items-center justify-center">
            <img src="${card.image}" class="h-24" />
          </div>
          <input id="userInput" type="text" placeholder="Traduction en français" class="border border-gray-300 rounded-md p-2 w-full">
          <button onclick="checkAnswer()" class="bg-[#D97690] text-white px-4 py-2 rounded-lg">Vérifier</button>
          <div id="result" class="text-md font-medium mt-2"></div>
          <div id="correction" class="text-gray-500 italic mt-1 hidden">Réponse : <strong>${card.word} = ${card.translation}</strong></div>
        </div>
        <div class="flex gap-4 mt-4">
          <button onclick="playAudio('${card.audio}')" class="bg-[#a28f8f] text-white px-3 py-2 rounded-lg">🔊 Écouter</button>
          <button onclick="nextCard()" class="bg-[#f0b7c9] text-[#5c2e36] px-4 py-2 rounded-lg">Suivante</button>
        </div>
      `;
    }

    function checkAnswer() {
      const userInput = document.getElementById("userInput").value.trim().toLowerCase();
      const card = flashcards[currentIndex];
      const resultBox = document.getElementById("result");
      const correction = document.getElementById("correction");

      if (!userInput) {
        resultBox.textContent = "⛔ Entre une réponse !";
        resultBox.className = "text-red-500 font-medium";
        correction.classList.add("hidden");
        return;
      }

      if (userInput === card.translation.toLowerCase()) {
        resultBox.textContent = "✅ Bonne réponse 🎉";
        resultBox.className = "text-green-600 font-semibold";
        score++;
        updateScoreDisplay();
      } else {
        resultBox.textContent = "❌ Faux !";
        resultBox.className = "text-red-500 font-semibold";
      }

      correction.classList.remove("hidden");
    }

    function nextCard() {
      currentIndex++;
      if (currentIndex >= flashcards.length) {
        document.getElementById("flashcardContainer").innerHTML = `
          <div class="text-center text-2xl text-[#D97690] font-semibold fade">
            Fin des flashcards !<br><br>Score : ${score} / ${flashcards.length}
            <br><button onclick="restart()" class="mt-4 bg-[#D97690] text-white px-4 py-2 rounded-lg">Recommencer</button>
          </div>
        `;
        updateScoreDisplay();
      } else {
        showFlashcard(currentIndex);
      }
    }

    function restart() {
      currentIndex = 0;
      score = 0;
      showFlashcard(currentIndex);
    }

    showFlashcard(currentIndex);

    const quizData = [
      {
        question: "Que veut dire 고양이 ?",
        options: ["chien", "chat", "souris", "pomme"],
        correct: "chat",
        audio: "https://ssl.gstatic.com/dictionary/static/sounds/oxford/cat--_fr_1.mp3"
      },
      {
        question: "Que veut dire 물 ?",
        options: ["feu", "eau", "thé", "lait"],
        correct: "eau",
        audio: "https://ssl.gstatic.com/dictionary/static/sounds/oxford/water--_fr_1.mp3"
      }
    ];

    let quizIndex = 0;

    function showQuiz(index) {
      const q = quizData[index];
      const container = document.getElementById("quizContainer");

      let optionsHTML = q.options.map(opt => `
        <label class="block">
          <input type="radio" name="quizOption" value="${opt}" class="mr-2"> ${opt}
        </label>
      `).join("");

      container.innerHTML = `
        <div class="bg-white p-6 rounded-3xl shadow-xl w-[350px] text-center border border-[#EBDACF] fade">
          <div class="text-xl font-semibold mb-4">${q.question}</div>
          ${optionsHTML}
          <button onclick="checkQuizAnswer()" class="mt-4 bg-[#D97690] text-white px-4 py-2 rounded-lg">Vérifier</button>
          <button onclick="playAudio('${q.audio}')" class="ml-4 bg-[#a28f8f] text-white px-3 py-2 rounded-lg">🔊 Écouter</button>
          <div id="quizResult" class="mt-3 text-md font-medium"></div>
        </div>
      `;
    }

    function checkQuizAnswer() {
      const selected = document.querySelector('input[name="quizOption"]:checked');
      const result = document.getElementById("quizResult");
      if (!selected) {
        result.textContent = "⛔ Choisis une option.";
        result.className = "text-red-500 font-medium";
        return;
      }
      const answer = selected.value;
      const correct = quizData[quizIndex].correct;

      if (answer === correct) {
        result.textContent = "✅ Bien joué !";
        result.className = "text-green-600 font-semibold";
      } else {
        result.textContent = `❌ Mauvaise réponse. C'était : ${correct}`;
        result.className = "text-red-500 font-semibold";
      }

      setTimeout(() => {
        quizIndex++;
        if (quizIndex < quizData.length) {
          showQuiz(quizIndex);
        } else {
          document.getElementById("quizContainer").innerHTML = `
            <div class="text-xl text-center text-[#D97690] font-semibold fade">
              🎉 Quiz terminé !<br><br>
              <button onclick="restartQuiz()" class="mt-4 bg-[#D97690] text-white px-4 py-2 rounded-lg">Rejouer</button>
            </div>
          `;
        }
      }, 2000);
    }

    function restartQuiz() {
      quizIndex = 0;
      showQuiz(quizIndex);
    }

    function showTab(tab) {
      document.getElementById("flashcards").classList.add("hidden");
      document.getElementById("quiz").classList.add("hidden");
      document.getElementById("tab-flashcards").classList.remove("tab-active");
      document.getElementById("tab-quiz").classList.remove("tab-active");

      document.getElementById(tab).classList.remove("hidden");
      document.getElementById("tab-" + tab).classList.add("tab-active");

      if (tab === "quiz") {
        showQuiz(quizIndex);
      }
    }
  </script>

</body>
</html>
